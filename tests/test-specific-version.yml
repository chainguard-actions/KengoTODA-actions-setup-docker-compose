name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '2.24.0'
      - name: Assert docker-compose specific version is installed
        run: |
          echo "Checking docker-compose is available..."
          if ! command -v docker-compose &>/dev/null; then
            echo "FAIL: docker-compose command not found"
            exit 1
          fi
          VERSION=$(docker-compose --version)
          echo "docker-compose version: $VERSION"
          if echo "$VERSION" | grep -q "2.24.0"; then
            echo "PASS: docker-compose 2.24.0 is installed"
          else
            echo "FAIL: expected version 2.24.0 but got: $VERSION"
            exit 1
          fi
