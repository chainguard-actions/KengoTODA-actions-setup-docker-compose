name: Test basic usage (default latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert docker-compose is installed
        run: |
          echo "Checking docker-compose is available..."
          if ! command -v docker-compose &>/dev/null; then
            echo "FAIL: docker-compose command not found"
            exit 1
          fi
          VERSION=$(docker-compose --version)
          echo "docker-compose version: $VERSION"
          echo "PASS: docker-compose is installed"
